<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .m { font-size: 10px; fill: #2f7a4a; text-anchor: middle; }
    .sweep { transform-origin: 210px 235px; animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { opacity: .2; animation: flash 4s linear infinite; }
    @keyframes flash { 0% { opacity: 1; } 10% { opacity: 1; } 100% { opacity: .2; } }
    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 4s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .9; } 25% { transform: scale(3.5); opacity: 0; } 100% { opacity: 0; } }
    .k { fill: #9fc9a8; font-size: 13px; } .v { fill: #3cff7a; font-weight: 700; }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="scope"><stop offset="0" stop-color="#0d2414"/><stop offset="1" stop-color="#07110a"/></radialGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#3cff7a" stop-opacity=".5"/><stop offset="1" stop-color="#3cff7a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="428" rx="10" fill="#070b08" stroke="#163a22"/>
  <path d="M11 1 H849 a10 10 0 0 1 10 10 V31 H1 V11 a10 10 0 0 1 10 -10 Z" fill="#0b140d"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#27c93f"/>
  <text x="430" y="20" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" fill="#2f7a4a" text-anchor="middle">approach radar · contributions, last 12 months</text>
  <circle cx="210" cy="235" r="165" fill="url(#scope)" stroke="#1d5a32"/>
  <circle cx="210" cy="235" r="41" fill="none" stroke="#163f25"/><circle cx="210" cy="235" r="83" fill="none" stroke="#163f25"/><circle cx="210" cy="235" r="124" fill="none" stroke="#163f25"/>
  <line x1="45" y1="235" x2="375" y2="235" stroke="#163f25"/><line x1="210" y1="70" x2="210" y2="400" stroke="#163f25"/>
  <line x1="210.0" y1="76.0" x2="210.0" y2="70.0" stroke="#2f7a4a"/><text x="223" y="56" class="m">OCT</text><line x1="226.3" y1="76.8" x2="226.9" y2="70.9" stroke="#2f7a4a"/><text x="241" y="59" class="m">NOV</text><line x1="301.9" y1="105.3" x2="305.4" y2="100.4" stroke="#2f7a4a"/><text x="326" y="97" class="m">DEC</text><line x1="354.9" y1="169.6" x2="360.4" y2="167.2" stroke="#2f7a4a"/><text x="382" y="176" class="m">JAN</text><line x1="368.1" y1="252.0" x2="374.1" y2="252.6" stroke="#2f7a4a"/><text x="390" y="271" class="m">FEB</text><line x1="342.4" y1="323.0" x2="347.4" y2="326.3" stroke="#2f7a4a"/><text x="355" y="351" class="m">MAR</text><line x1="279.7" y1="377.9" x2="282.3" y2="383.3" stroke="#2f7a4a"/><text x="279" y="409" class="m">APR</text><line x1="200.5" y1="393.7" x2="200.1" y2="399.7" stroke="#2f7a4a"/><text x="186" y="420" class="m">MAY</text><line x1="121.5" y1="367.1" x2="118.1" y2="372.0" stroke="#2f7a4a"/><text x="98" y="384" class="m">JUN</text><line x1="68.0" y1="306.5" x2="62.6" y2="309.2" stroke="#2f7a4a"/><text x="41" y="310" class="m">JUL</text><line x1="51.3" y1="224.8" x2="45.3" y2="224.4" stroke="#2f7a4a"/><text x="29" y="215" class="m">AUG</text><line x1="78.3" y1="145.9" x2="73.3" y2="142.5" stroke="#2f7a4a"/><text x="66" y="126" class="m">SEP</text><line x1="139.1" y1="92.7" x2="136.4" y2="87.3" stroke="#2f7a4a"/><text x="140" y="70" class="m">OCT</text>
  <g class="blip" style="animation-delay:3.85s"><circle cx="194.5" cy="171.8" r="7.0" fill="#3cff7a"/><circle class="ring" style="animation-delay:3.85s" cx="194.5" cy="171.8" r="7.0" fill="none" stroke="#3cff7a"/></g>

  <!-- a traffic contact drifting across the scope -->
  <g>
    <path d="M15 0 L1 -2 L-7 -10 L-10 -10 L-6 -1 L-15 0 L-6 1 L-10 10 L-7 10 L1 2 Z" transform="scale(.45)" fill="#39d0ff"/>
    <animateMotion path="M65 305 L345 145" rotate="auto" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="26s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="10" y="-8" font-size="9" fill="#39d0ff">AERONYRO FL350</text>
    <animateMotion path="M65 305 L345 145" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="26s" repeatCount="indefinite"/>
  </g>

  <g class="sweep">
    <path d="M210 235 L93.3 118.3 A165 165 0 0 1 210.0 70.0 Z" fill="url(#beam)"/>
    <line x1="210" y1="235" x2="210.0" y2="70.0" stroke="#3cff7a" stroke-width="1.5"/>
  </g>
  <circle cx="210" cy="235" r="3" fill="#3cff7a"/>

  <g transform="translate(450,110)">
    <text class="k" fill="#2f7a4a" style="fill:#2f7a4a">$ <tspan class="v">radar</tspan> --contacts<tspan class="v blink"> █</tspan></text>
    <text y="40" class="k" xml:space="preserve">contributions ...... <tspan class="v">4</tspan></text>
    <text y="66" class="k" xml:space="preserve">current streak ..... <tspan class="v">0d</tspan></text>
    <text y="92" class="k" xml:space="preserve">longest streak ..... <tspan class="v">1d</tspan></text>
    <text y="118" class="k" xml:space="preserve">busiest month ...... <tspan class="v">OCT</tspan></text>
    <text y="160" font-size="11" fill="#2f7a4a">one blip = one day you contributed</text>
    <text y="178" font-size="11" fill="#2f7a4a">bigger blip = busier day · 12 o'clock = a year ago</text>
    <text y="222" class="k">tower: <tspan class="v">"hold short, awaiting commits"</tspan></text>
  </g>
</svg>