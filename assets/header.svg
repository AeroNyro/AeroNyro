<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .dim { fill: #7a6430; } .amb { fill: #ffb000; } .cyan { fill: #39d0ff; }
    .flap { fill: #141414; stroke: #2a2a2a; }
    .ch { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 30px; font-weight: 700; fill: #ffb000; text-anchor: middle; }
    .roll { animation: roll .9s steps(6) both; }
    @keyframes roll { 0% { opacity: 0; transform: translateY(-14px); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    .cross { animation: cross 12s linear infinite; } @keyframes cross { from { transform: translateX(-40px); } to { transform: translateX(900px); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(3.2); opacity: 0; } }
  </style>
  <rect x="1" y="1" width="858" height="298" rx="10" fill="#0b0b0b" stroke="#3a2f12"/>
  <path d="M11 1 H849 a10 10 0 0 1 10 10 V31 H1 V11 a10 10 0 0 1 10 -10 Z" fill="#151208"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#27c93f"/>
  <text x="430" y="20" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" fill="#7a6430" text-anchor="middle">departures · terminal 1 · gate 404</text>
  <g class="mono dim" font-size="11" letter-spacing="1.5">
    <text x="32" y="62">FLIGHT</text><text x="180" y="62">DESTINATION</text><text x="600" y="62">STATUS</text>
  </g>
  <g class="roll" style="animation-delay:0.05s"><rect class="flap" x="30" y="72" width="26" height="40" rx="3"/><text class="ch" x="43" y="103">G</text></g><g class="roll" style="animation-delay:0.12s"><rect class="flap" x="58" y="72" width="26" height="40" rx="3"/><text class="ch" x="71" y="103">H</text></g><g class="roll" style="animation-delay:0.19s"><rect class="flap" x="86" y="72" width="26" height="40" rx="3"/><text class="ch" x="99" y="103">0</text></g><g class="roll" style="animation-delay:0.26s"><rect class="flap" x="114" y="72" width="26" height="40" rx="3"/><text class="ch" x="127" y="103">1</text></g><g class="roll" style="animation-delay:0.33s"><rect class="flap" x="178" y="72" width="26" height="40" rx="3"/><text class="ch" x="191" y="103">A</text></g><g class="roll" style="animation-delay:0.40s"><rect class="flap" x="206" y="72" width="26" height="40" rx="3"/><text class="ch" x="219" y="103">E</text></g><g class="roll" style="animation-delay:0.47s"><rect class="flap" x="234" y="72" width="26" height="40" rx="3"/><text class="ch" x="247" y="103">R</text></g><g class="roll" style="animation-delay:0.54s"><rect class="flap" x="262" y="72" width="26" height="40" rx="3"/><text class="ch" x="275" y="103">O</text></g><g class="roll" style="animation-delay:0.61s"><rect class="flap" x="290" y="72" width="26" height="40" rx="3"/><text class="ch" x="303" y="103">N</text></g><g class="roll" style="animation-delay:0.68s"><rect class="flap" x="318" y="72" width="26" height="40" rx="3"/><text class="ch" x="331" y="103">Y</text></g><g class="roll" style="animation-delay:0.75s"><rect class="flap" x="346" y="72" width="26" height="40" rx="3"/><text class="ch" x="359" y="103">R</text></g><g class="roll" style="animation-delay:0.82s"><rect class="flap" x="374" y="72" width="26" height="40" rx="3"/><text class="ch" x="387" y="103">O</text></g>
  <rect x="598" y="72" width="232" height="40" rx="3" fill="#0f1a0f" stroke="#1f3a1f"/>
  <circle class="blink" cx="616" cy="92" r="5" fill="#3cff7a"/>
  <text x="630" y="98" class="mono" font-size="17" font-weight="700" fill="#3cff7a">BOARDING · ON TIME</text>

  <line x1="30" y1="134" x2="830" y2="134" stroke="#3a2f12" stroke-dasharray="4 4"/>
  <g class="cross"><path d="M15 0 L1 -2 L-7 -10 L-10 -10 L-6 -1 L-15 0 L-6 1 L-10 10 L-7 10 L1 2 Z" transform="translate(0,134) scale(.7)" fill="#ffb000" opacity=".6"/></g>

  <g class="mono">
    <text x="32" y="168" font-size="14" class="dim">$ <tspan class="amb">atc</tspan> --identify</text>
    <text x="32" y="200" font-size="15" fill="#e8e0c8" xml:space="preserve">callsign   <tspan class="amb">AeroNyro</tspan></text>
    <text x="32" y="224" font-size="15" fill="#e8e0c8" xml:space="preserve">aircraft   <tspan class="cyan">developer / avgeek</tspan></text>
    <text x="32" y="248" font-size="15" fill="#e8e0c8" xml:space="preserve">in service <tspan class="cyan">since 2026</tspan></text>
    <text x="32" y="272" font-size="15" fill="#e8e0c8" xml:space="preserve">squawk     <tspan class="amb">7000</tspan><tspan class="amb blink"> █</tspan></text>
  </g>

  <!-- IDEA → SHIPPED: a plane flies the route, drawing its track behind it -->
  <path d="M470 262 Q 625 140 805 196" fill="none" stroke="#39d0ff" stroke-width="1.5" stroke-dasharray="3 5" opacity=".35"/>
  <path d="M470 262 Q 625 140 805 196" fill="none" stroke="#39d0ff" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.8;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <circle cx="470" cy="262" r="4" fill="#ffb000"/>
  <circle class="pulse" cx="805" cy="196" r="4" fill="none" stroke="#3cff7a"/>
  <circle cx="805" cy="196" r="4" fill="#3cff7a"/>
  <g>
    <path d="M15 0 L1 -2 L-7 -10 L-10 -10 L-6 -1 L-15 0 L-6 1 L-10 10 L-7 10 L1 2 Z" fill="#ffb000"/>
    <animateMotion path="M470 262 Q 625 140 805 196" rotate="auto" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.8;.86;1" dur="7s" repeatCount="indefinite"/>
  </g>
  <text x="470" y="286" class="mono dim" font-size="11" text-anchor="middle">IDEA</text>
  <text x="805" y="222" class="mono" font-size="11" fill="#3cff7a" text-anchor="middle">SHIPPED</text>
  <text x="640" y="160" class="mono dim" font-size="11" text-anchor="middle">FL350 · 1 commits flown</text>
</svg>