<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .k { fill: #7a6430; font-size: 9px; letter-spacing: 1.5px; }
    .v { fill: #e8e0c8; font-size: 13px; font-weight: 700; }
    .card { animation: slide .7s 0s ease-out both; } @keyframes slide { from { opacity: 0; transform: translateY(8px); } }
    .fly { animation: fly 3.5s ease-in-out infinite; } @keyframes fly { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(66px); opacity: 0; } }
    .scan { animation: scan 2.6s ease-in-out infinite; } @keyframes scan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(38px); } }
  </style>
  <g class="card">
    <rect x="1" y="1" width="418" height="188" rx="10" fill="#0b0b0b" stroke="#3a2f12"/>
    <path d="M11 1 H409 a10 10 0 0 1 10 10 V29 H1 V11 a10 10 0 0 1 10 -10 Z" fill="#ffb000"/>
    <text x="16" y="20" font-size="11" font-weight="700" fill="#0b0b0b" letter-spacing="2">BOARDING PASS</text>
    <text x="404" y="20" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="end">GH AIR · PILOT-DEV</text>
    <line x1="312" y1="34" x2="312" y2="184" stroke="#3a2f12" stroke-dasharray="3 4"/>
    <circle cx="312" cy="29" r="6" fill="#0d1117"/><circle cx="312" cy="190" r="6" fill="#0d1117"/>

    <text x="16" y="58" font-size="22" font-weight="700" fill="#ffb000">DEV</text>
    <line x1="80" y1="50" x2="164" y2="50" stroke="#7a6430" stroke-dasharray="3 3"/>
    <g class="fly"><path d="M15 0 L1 -2 L-7 -10 L-10 -10 L-6 -1 L-15 0 L-6 1 L-10 10 L-7 10 L1 2 Z" transform="translate(88,50) scale(.6)" fill="#ffb000"/></g>
    <text x="172" y="58" font-size="22" font-weight="700" fill="#ffb000">FLI</text>

    <text x="16" y="84" class="k">REPOSITORY</text>
    <text x="16" y="100" font-size="13" font-weight="700" fill="#39d0ff">flight-tracker</text>
    <text x="16" y="122" font-size="11" fill="#b8ad90">Live ADS-B flight tracker that plots</text>
    <text x="16" y="137" font-size="11" fill="#b8ad90">aircraft on a map in real time.</text>
    <circle cx="21" cy="164" r="5" fill="#3178c6"/>
    <text x="32" y="168" font-size="11" fill="#e8e0c8">TypeScript</text>

    <text x="326" y="54" class="k">STARS</text><text x="326" y="70" class="v">14</text>
    <text x="372" y="54" class="k">FORKS</text><text x="372" y="70" class="v">3</text>
    <text x="326" y="94" class="k">GATE</text><text x="326" y="110" class="v">A1</text>
    <g fill="#e8e0c8"><rect x="326.0" y="128" width="3" height="40"/><rect x="330.6" y="128" width="3" height="40"/><rect x="335.2" y="128" width="3" height="40"/><rect x="339.8" y="128" width="3" height="40"/><rect x="344.4" y="128" width="3" height="40"/><rect x="349.0" y="128" width="3" height="40"/><rect x="353.6" y="128" width="3" height="40"/><rect x="358.2" y="128" width="3" height="40"/><rect x="362.8" y="128" width="3" height="40"/><rect x="367.4" y="128" width="3" height="40"/><rect x="372.0" y="128" width="1" height="40"/><rect x="374.6" y="128" width="1" height="40"/><rect x="377.2" y="128" width="1" height="40"/><rect x="379.8" y="128" width="1" height="40"/><rect x="382.4" y="128" width="1" height="40"/><rect x="385.0" y="128" width="1" height="40"/><rect x="387.6" y="128" width="1" height="40"/><rect x="390.2" y="128" width="1" height="40"/><rect x="392.8" y="128" width="1" height="40"/><rect x="395.4" y="128" width="1" height="40"/><rect x="398.0" y="128" width="1" height="40"/><rect x="400.6" y="128" width="1" height="40"/><rect x="403.2" y="128" width="1" height="40"/></g>
    <rect class="scan" x="322" y="127" width="86" height="2" fill="#ff5f56" opacity=".8"/>
  </g>
</svg>