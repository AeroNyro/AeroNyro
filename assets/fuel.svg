<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .lbl { fill: #e8e0c8; font-size: 12px; text-anchor: middle; }
    .pct { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .needle { transform-box: fill-box; transform-origin: 50% 100%;
      animation: sweep 1.6s cubic-bezier(.3,1.4,.5,1) both, idle 3.2s ease-in-out infinite; }
    @keyframes sweep { from { transform: rotate(var(--from)); } }
    @keyframes idle { 0%,100% { transform: rotate(0); } 30% { transform: rotate(2.5deg); } 65% { transform: rotate(-1.5deg); } }
    .low { animation: low 1.4s ease-in-out infinite; } @keyframes low { 50% { opacity: .25; } }
  </style>
  <rect x="1" y="1" width="418" height="248" rx="10" fill="#0b0b0b" stroke="#3a2f12"/>
  <path d="M11 1 H409 a10 10 0 0 1 10 10 V31 H1 V11 a10 10 0 0 1 10 -10 Z" fill="#151208"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#27c93f"/>
  <text x="210" y="20" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" fill="#7a6430" text-anchor="middle">fuel · languages by bytes</text>
  <text x="22" y="58" font-size="13" fill="#7a6430">$ <tspan fill="#ffb000">fuel</tspan> --tanks</text>
  <defs>
    <g id="dial">
      <path d="M-44 0 A44 44 0 0 1 44 0" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round"/>
      <path class="low" d="M-44 0 A44 44 0 0 1 -38 -22" fill="none" stroke="#ff5f56" stroke-width="8" stroke-linecap="round" opacity=".7"/>
      <g stroke="#555" stroke-width="1.5">
        <line x1="-36" y1="0" x2="-30" y2="0"/><line x1="0" y1="-36" x2="0" y2="-30"/><line x1="36" y1="0" x2="30" y2="0"/>
        <line x1="-25.5" y1="-25.5" x2="-21" y2="-21"/><line x1="25.5" y1="-25.5" x2="21" y2="-21"/>
      </g>
      <text x="-40" y="16" font-size="10" fill="#7a6430" text-anchor="middle">E</text>
      <text x="40" y="16" font-size="10" fill="#7a6430" text-anchor="middle">F</text>
    </g>
  </defs>
  <g transform="translate(78,150)">
    <use href="#dial"/>
    <path d="M-44 0 A44 44 0 0 1 13.6 -41.8" fill="none" stroke="#3178c6" stroke-width="8" stroke-linecap="round"/>
    <g transform="rotate(18.0)"><line class="needle" style="--from:-108.0deg;animation-delay:0s, 1.6s" x1="0" y1="0" x2="0" y2="-38" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/></g>
    <circle r="5" fill="#ffb000"/>
    <text y="40" class="pct" fill="#3178c6">60%</text>
    <text y="60" class="lbl">TypeScript</text>
  </g>
  <g transform="translate(210,150)">
    <use href="#dial"/>
    <path d="M-44 0 A44 44 0 0 1 -30.1 -32.1" fill="none" stroke="#3572A5" stroke-width="8" stroke-linecap="round"/>
    <g transform="rotate(-43.2)"><line class="needle" style="--from:-46.8deg;animation-delay:0.25s, 1.85s" x1="0" y1="0" x2="0" y2="-38" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/></g>
    <circle r="5" fill="#ffb000"/>
    <text y="40" class="pct" fill="#3572A5">26%</text>
    <text y="60" class="lbl">Python</text>
  </g>
  <g transform="translate(342,150)">
    <use href="#dial"/>
    <path d="M-44 0 A44 44 0 0 1 -42.6 -10.9" fill="none" stroke="#f1e05a" stroke-width="8" stroke-linecap="round"/>
    <g transform="rotate(-75.6)"><line class="needle" style="--from:-14.4deg;animation-delay:0.5s, 2.1s" x1="0" y1="0" x2="0" y2="-38" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/></g>
    <circle r="5" fill="#ffb000"/>
    <text y="40" class="pct" fill="#f1e05a">8%</text>
    <text y="60" class="lbl">JavaScript</text>
  </g>
</svg>