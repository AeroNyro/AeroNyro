<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .row { fill: #e8e0c8; font-size: 13px; animation: in .5s ease-out both; }
    .val { fill: #ffb000; font-weight: 700; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="418" height="248" rx="10" fill="#0b0b0b" stroke="#3a2f12"/>
  <path d="M11 1 H409 a10 10 0 0 1 10 10 V31 H1 V11 a10 10 0 0 1 10 -10 Z" fill="#151208"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#27c93f"/>
  <text x="210" y="20" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" fill="#7a6430" text-anchor="middle">pilot logbook · last 12 months</text>
  <text x="22" y="58" font-size="13" fill="#7a6430">$ <tspan fill="#ffb000">logbook</tspan> --summary<tspan class="blink" fill="#ffb000"> █</tspan></text>
  <text class="row" style="animation-delay:0.1s" x="22" y="88" xml:space="preserve">flights (commits) <tspan fill="#4a3d1c">........................</tspan> <tspan class="val">2</tspan></text>
  <text class="row" style="animation-delay:0.2s" x="22" y="110" xml:space="preserve">landings (PRs) <tspan fill="#4a3d1c">...........................</tspan> <tspan class="val">0</tspan></text>
  <text class="row" style="animation-delay:0.3s" x="22" y="132" xml:space="preserve">squawks (issues) <tspan fill="#4a3d1c">.........................</tspan> <tspan class="val">0</tspan></text>
  <text class="row" style="animation-delay:0.4s" x="22" y="154" xml:space="preserve">inspections (reviews) <tspan fill="#4a3d1c">....................</tspan> <tspan class="val">0</tspan></text>
  <text class="row" style="animation-delay:0.5s" x="22" y="176" xml:space="preserve">hangars (repos) <tspan fill="#4a3d1c">..........................</tspan> <tspan class="val">1</tspan></text>
  <text class="row" style="animation-delay:0.6s" x="22" y="198" xml:space="preserve">stars earned <tspan fill="#4a3d1c">.............................</tspan> <tspan class="val">0</tspan></text>
